name: Sync Lecture Recordings

on:
  # Schedule: Run at 5:00 PM EST (21:00 UTC) on Mon/Wed/Fri
  schedule:
    - cron: '0 21 * * 1,3,5'  # Monday, Wednesday, Friday at 21:00 UTC (5:00 PM EST)

  # Allow manual trigger
  workflow_dispatch:

# Permissions for GITHUB_TOKEN
permissions:
  contents: write  # Required to push changes

jobs:
  sync-recordings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history for proper git operations

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync lecture recordings from Google Sheet
        env:
          # Google Drive credentials (base64 encoded)
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

          # Git configuration
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER_NAME: 'Course Automation Bot'
          GIT_USER_EMAIL: 'github-actions[bot]@users.noreply.github.com'
        run: npm run sync:recordings:push

      - name: Summary
        if: always()
        run: |
          echo "### Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Recordings sync completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Recordings sync failed - check logs above" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
