name: Sync Slides and Recordings from Slack

on:
  # 11:00 AM EST (16:00 UTC) — picks up slides sent before lecture
  # 5:00 PM EST (22:00 UTC) — picks up recording links sent after lecture
  schedule:
    - cron: '0 16 * * 1,3,5'
    - cron: '0 22 * * 1,3,5'

  # Allow manual trigger for testing
  workflow_dispatch:

# Required to push lectureData.ts and state file changes back to the repo
permissions:
  contents: write

jobs:
  sync-from-slack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Poll Slack and sync content
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER_NAME: 'Course Automation Bot'
          GIT_USER_EMAIL: 'github-actions[bot]@users.noreply.github.com'
        run: npm run sync:slides:from-slack:push

      - name: Summary
        if: always()
        run: |
          echo "### Slack Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Slack content sync completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Slack content sync failed - check logs above" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
